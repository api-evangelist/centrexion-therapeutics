aid: centrexion-therapeutics
name: Centrexion Therapeutics
description: >-
  Centrexion Therapeutics is a late clinical-stage biopharmaceutical company headquartered at One
  Boston Place, Suite 3520, Boston, Massachusetts, developing novel non-opioid, non-addictive
  therapies for chronic pain alongside an emerging portfolio in immunology and inflammation. The
  company was founded by Sol Barer, Ph.D. — a founder of Celgene, who chairs the board — and by
  James N. Campbell, M.D., president and chief scientific officer and Professor Emeritus of
  neurosurgery at Johns Hopkins University School of Medicine. Jeffrey B. Kindler, formerly chief
  executive of Pfizer, joined as chief executive officer in 2013. Its lead asset, CNTX-4975, is a
  highly purified synthetic trans-capsaicin injected directly into the painful joint that produces
  analgesia by reversibly deactivating the end terminals of TRPV1-expressing primary afferent pain
  fibers, delivering pain relief that can last months while clearing the body within 24 hours; the
  FDA granted it Fast Track designation for moderate-to-severe osteoarthritis knee pain. Centrexion
  runs no developer program and publishes no product API, developer portal, API documentation, SDK
  or status page. The only machine-readable surface reachable without credentials is the WordPress
  REST content API behind centrexion.com, catalogued here, together with an llms.txt the site
  generates for AI crawlers.
