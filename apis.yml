apis:
- aid: centrexion-therapeutics:centrexion-therapeutics-content-api
  name: Centrexion Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind centrexion.com. It exposes the six published
    corporate pages (Home, Team, Pipeline, Contact, Privacy Policy, Terms of Use), the single
    published post, the media library, the category and post_series taxonomies, the registered post
    types and statuses, cross-content search, the navigation menu object, and the oEmbed 1.0
    provider endpoint. This is not a developer product Centrexion markets; it is the site's own
    content surface, registered at /wp-json/ and verified to return data without credentials. The
    OpenAPI in this repo is derived from the published route index and restricted to operations that
    answered anonymously.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://centrexion.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - pages
  - media
  properties:
  - type: OpenAPI
    url: openapi/centrexion-therapeutics-content-openapi.yml
  - type: Overlay
    url: overlays/centrexion-therapeutics-content-overlay.yaml
  - type: Authentication
    url: authentication/centrexion-therapeutics-authentication.yml
  - type: ErrorCatalog
    url: errors/centrexion-therapeutics-problem-types.yml
  - type: Conventions
    url: conventions/centrexion-therapeutics-conventions.yml
  - type: DataModel
    url: data-model/centrexion-therapeutics-data-model.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://centrexion.com/wp-json/ — 320 routes across 10 namespaces (oembed/1.0,
    wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, aioseo/v1, sliderrevolution, google-site-kit/v1,
    wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1) — and verified against live
    anonymous responses on 2026-08-09. Only operations that returned data without credentials are
    modelled; every write route and the entire plugin-administration surface is excluded. Anonymous
    401s recorded at harvest: /wp/v2/settings (rest_forbidden), /wp/v2/menus, /wp/v2/menu-locations
    and /wp/v2/icons (rest_cannot_view), /wp/v2/themes (rest_cannot_view_themes), /wp/v2/plugins
    (rest_cannot_view_plugins), /wp/v2/block-types (rest_block_type_cannot_view),
    /wp/v2/font-collections (rest_cannot_read), /wp/v2/sidebars and /wp/v2/widget-types
    (rest_cannot_manage_widgets), /wp/v2/pattern-directory/patterns
    (rest_pattern_directory_cannot_view) and /wp/v2/block-patterns/categories (rest_cannot_view).
    Notably the site registers the WordPress Abilities API (wp-abilities/v1), an agent-facing
    capability registry whose /abilities and /categories routes both returned 401 rest_forbidden
    anonymously, so no MCP, agent-card or agent-tool surface is claimed for this provider and no
    MCPServer pointer is emitted. The company's 14 staff biographies are published as a WordPress
    custom post type that is NOT registered for REST (absent from /wp/v2/types), so they are
    reachable only as HTML and are deliberately not modelled. The deployment is served by nginx
    behind WP Engine caching and sets x-robots-tag: noindex on API responses. Centrexion publishes
    no developer documentation, no API reference, no getting-started guide and no support channel
    for this surface, so no Documentation / APIReference / GettingStarted pointers are emitted; the
    humanURL above is the upstream WordPress REST handbook that defines the wp/v2 contract. Nothing
    here was obtained with credentials.
