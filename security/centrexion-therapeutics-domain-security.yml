observations:
- >-
  No DMARC record is published at _dmarc.centrexion.com (empty TXT response). SPF is present and
  strict (-all, delegated to Check Point's hosted email-security SPF service), but with no DMARC
  policy there is no alignment enforcement and no aggregate or forensic reporting, so the domain has
  neither spoofing enforcement beyond SPF nor any visibility into abuse.
- >-
  DANGLING CNAME — investors.centrexion.com is a CNAME to centrexion.gcs-web.com, and that target
  has no A record while its parent zone gcs-web.com is live on AWS Route 53 nameservers. The name
  therefore resolves as a CNAME but terminates in NXDOMAIN, and nothing answers on 80 or 443. A
  CNAME left pointing at a de-provisioned host on a third-party investor-relations platform is the
  classic subdomain-takeover precondition; whoever can claim that hostname on the upstream platform
  inherits a subdomain of centrexion.com. Recommend deleting the record or reclaiming the target.
- >-
  portal.centrexion.com resolves to 72.20.122.198 but both 443 and 80 are closed/filtered — a stale
  A record for a host that no longer serves. sharepoint.centrexion.com (66.227.71.31) behaves the
  same way. Neither is a live surface; both are residue.
- No Strict-Transport-Security header on the site root.
