gaps:
- >-
  The 14 staff biographies rendered on the Team page are a WordPress custom post type that is NOT
  registered for REST — it is absent from /wp/v2/types and has no route. There is therefore no Staff
  entity in this graph and no relationship from Page to it, even though the content exists on the
  site. It is reachable only as HTML inside pages/16 `content.rendered`.
- >-
  The drug pipeline (CNTX-4975 and the immunology programmes) is likewise not modelled as data. It
  exists only as rendered HTML inside pages/17 `content.rendered`. There is no structured
  representation of programmes, indications, mechanisms or clinical phases anywhere on this API.
