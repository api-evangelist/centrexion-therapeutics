format: wordpress-rest-error
rfc9457: false
note: >-
  This API does NOT use RFC 9457 problem+json. It returns the WordPress REST error envelope —
  `{"code": "<machine_code>", "message": "<human message>", "data": {"status": <http_status>}}` —
  with `Content-Type: application/json`. On `rest_invalid_param` the `data` object additionally
  carries `params` (per-parameter human messages) and `details` (per-parameter structured detail).
  Every entry below was produced by an actual request made anonymously on 2026-08-09; the `probe`
  field records the exact request that produced it. Codes are stable WordPress core identifiers and
  are the correct thing for a client to branch on — the `message` strings are localisable and must
  not be matched against.
envelope:
  fields:
    code: Machine-readable, stable, safe to branch on.
    message: Human-readable and localisable. Do not match on this.
    data.status: The HTTP status code, duplicated inside the body.
    data.params: Present only on rest_invalid_param — a map of parameter name to message.
    data.details: Present only on rest_invalid_param — a map of parameter name to structured detail.
