  title: Invalid parameter(s)
  detail: >-
    A query parameter failed validation. The response body names the offending parameter in both
    data.params and data.details. Two distinct causes were observed — a per_page above the maximum
    of 100, and a status other than publish requested anonymously.
  probe: GET /wp/v2/posts?per_page=500
  also_observed_on: ['GET /wp/v2/posts?status=draft']
  source_operation: openapi/centrexion-therapeutics-content-openapi.yml#listPosts
  remediation: >-
    Keep per_page between 1 and 100. Do not request a status other than publish without
    credentials — an anonymous caller cannot see any other status on this deployment.
